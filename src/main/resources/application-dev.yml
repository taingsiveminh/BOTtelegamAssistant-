spring:
  datasource:
    url: jdbc:h2:mem:telegram_bot_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:8986988980:AAEqOSNB7blwM_h4JGl9TzsWqFrGxZKwW-A}
  bot-username: ${TELEGRAM_BOT_USERNAME:TsmDev_obot}
  mode: polling

ai:
  provider: ${AI_PROVIDER:groq}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  model: ${AI_MODEL:openai/gpt-oss-120b}
